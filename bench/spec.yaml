sample_pdf: adl4p-exercise-07-GNNs.pdf
pdf_kind: exercise            # exercise | paper | lecture -> selects preprocessing prompt

# Each model is stamped into BOTH config surfaces (preprocessing + synto.toml).
# Provider keys are read from the environment (e.g. DEEPSEEK_API_KEY) by the
# underlying clients; ollama needs none.
models:
  - id: ollama-deepseek
    provider: ollama
    model: deepseek-v4-pro:cloud
    url: http://localhost:11434
